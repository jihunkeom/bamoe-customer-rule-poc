apiVersion: v1
kind: ServiceAccount
metadata:
  name: bamoe-canvas-deployer
  labels:
    app.kubernetes.io/name: bamoe-canvas-deployer
    app.kubernetes.io/component: sandbox-deployer
    app.kubernetes.io/part-of: bamoe-customer-rule-poc
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bamoe-canvas-deployer
  labels:
    app.kubernetes.io/name: bamoe-canvas-deployer
    app.kubernetes.io/component: sandbox-deployer
    app.kubernetes.io/part-of: bamoe-customer-rule-poc
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bamoe-canvas-deployer
  labels:
    app.kubernetes.io/name: bamoe-canvas-deployer
    app.kubernetes.io/component: sandbox-deployer
    app.kubernetes.io/part-of: bamoe-customer-rule-poc
subjects:
  - kind: ServiceAccount
    name: bamoe-canvas-deployer
    namespace: bamoe-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bamoe-canvas-deployer
