apiVersion: apps/v1
kind: Deployment
metadata:
  name: bamoe-management-console
  labels:
    app.kubernetes.io/name: bamoe-management-console
    app.kubernetes.io/component: management
    app.kubernetes.io/part-of: bamoe-runtime-environment
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: bamoe-management-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bamoe-management-console
        app.kubernetes.io/component: management
        app.kubernetes.io/part-of: bamoe-runtime-environment
      annotations:
        productName: "IBM Process Automation Manager Open Edition"
        productID: "72984f114b54496a8a44be139154a988"
        productVersion: "9.5.0"
        productMetric: "VIRTUAL_PROCESSOR_CORE"
        productChargedContainers: "All"
        includeSWCUpload: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: management-console
          image: quay.io/bamoe/management-console:9.5.0-ibm-0005
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RUNTIME_TOOLS_MANAGEMENT_CONSOLE_MANAGED_BUSINESS_SERVICES
              value: >-
                [{"name":"SKT Customer Rule PoC","businessServiceUrl":"https://customer-rule-poc.apps.itz-ygi22x.infra01-lb.wdc07.techzone.ibm.com"}]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: bamoe-management-console
  labels:
    app.kubernetes.io/name: bamoe-management-console
    app.kubernetes.io/part-of: bamoe-runtime-environment
spec:
  selector:
    app.kubernetes.io/name: bamoe-management-console
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bamoe-management-console
  labels:
    app.kubernetes.io/name: bamoe-management-console
    app.kubernetes.io/part-of: bamoe-runtime-environment
spec:
  host: bamoe-management-console.apps.itz-ygi22x.infra01-lb.wdc07.techzone.ibm.com
  to:
    kind: Service
    name: bamoe-management-console
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
