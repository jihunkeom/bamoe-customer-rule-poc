apiVersion: apps/v1
kind: Deployment
metadata:
  name: bamoe-mcp-server
  labels:
    app.kubernetes.io/name: bamoe-mcp-server
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: bamoe-runtime-environment
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: bamoe-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bamoe-mcp-server
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: bamoe-runtime-environment
      annotations:
        productName: "IBM Process Automation Manager Open Edition"
        productID: "72984f114b54496a8a44be139154a988"
        productVersion: "9.5.0"
        productMetric: "VIRTUAL_PROCESSOR_CORE"
        productChargedContainers: "All"
        includeSWCUpload: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: quay.io/bamoe/mcp-server:9.5.0-ibm-0005
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MCP_SERVER_OPENAPI_URLS
              value: "http://customer-rule-poc.bamoe-poc.svc.cluster.local:8080/v3/api-docs"
            - name: MCP_SERVER_SECURITY_ENABLED
              value: "false"
            - name: MCP_SERVER_SECURITY_AUTH_PERMISSION
              value: "permit"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: bamoe-mcp-server
  labels:
    app.kubernetes.io/name: bamoe-mcp-server
    app.kubernetes.io/part-of: bamoe-runtime-environment
spec:
  selector:
    app.kubernetes.io/name: bamoe-mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: http
