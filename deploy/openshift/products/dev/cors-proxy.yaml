apiVersion: apps/v1
kind: Deployment
metadata:
  name: bamoe-cors-proxy
  labels:
    app.kubernetes.io/name: bamoe-cors-proxy
    app.kubernetes.io/component: browser-proxy
    app.kubernetes.io/part-of: bamoe-dev-environment
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: bamoe-cors-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bamoe-cors-proxy
        app.kubernetes.io/component: browser-proxy
        app.kubernetes.io/part-of: bamoe-dev-environment
      annotations:
        productName: "IBM Process Automation Manager Open Edition"
        productID: "72984f114b54496a8a44be139154a988"
        productVersion: "9.5.0"
        productMetric: "VIRTUAL_PROCESSOR_CORE"
        productChargedContainers: "All"
        includeSWCUpload: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cors-proxy
          image: quay.io/bamoe/cors-proxy:9.5.0-ibm-0005
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CORS_PROXY_ALLOWED_ORIGINS
              value: "https://bamoe-canvas.apps.itz-ygi22x.infra01-lb.wdc07.techzone.ibm.com"
            - name: CORS_PROXY_ALLOWED_HOSTS
              value: "github.com,*.github.com,*.githubusercontent.com,api.itz-ygi22x.infra01-lb.wdc07.techzone.ibm.com,*.apps.itz-ygi22x.infra01-lb.wdc07.techzone.ibm.com"
            - name: CORS_PROXY_VERBOSE
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: bamoe-cors-proxy
  labels:
    app.kubernetes.io/name: bamoe-cors-proxy
    app.kubernetes.io/part-of: bamoe-dev-environment
spec:
  selector:
    app.kubernetes.io/name: bamoe-cors-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bamoe-cors-proxy
  labels:
    app.kubernetes.io/name: bamoe-cors-proxy
    app.kubernetes.io/part-of: bamoe-dev-environment
spec:
  host: bamoe-cors-proxy.apps.itz-ygi22x.infra01-lb.wdc07.techzone.ibm.com
  to:
    kind: Service
    name: bamoe-cors-proxy
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
