apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-rule-poc
  labels:
    app.kubernetes.io/name: customer-rule-poc
    app.kubernetes.io/part-of: bamoe-customer-rule-poc
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-rule-poc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-rule-poc
        app.kubernetes.io/part-of: bamoe-customer-rule-poc
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: customer-rule-poc:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: customer-rule-poc
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-rule-poc
  labels:
    app.kubernetes.io/name: customer-rule-poc
    app.kubernetes.io/part-of: bamoe-customer-rule-poc
spec:
  selector:
    app.kubernetes.io/name: customer-rule-poc
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: customer-rule-poc-management
  labels:
    app.kubernetes.io/name: customer-rule-poc
    app.kubernetes.io/component: management
    app.kubernetes.io/part-of: bamoe-customer-rule-poc
spec:
  selector:
    app.kubernetes.io/name: customer-rule-poc
  ports:
    - name: management
      port: 8081
      targetPort: management
